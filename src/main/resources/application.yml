server:
  port: 8085
  error:
    include-message: always

spring:
  application:
    name: ms-barriodigital-kafka-admin
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Solo kafka-admin crea topics. Los demás servicios no declaran NewTopic.
    admin:
      auto-create: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
